<!doctype html>
<html lang="en">
<head>

<title>Croissant</title>

<div class="page">
  <nav class="tabs" role="tablist" aria-label="settings">
    <button type="button" role="tab" data-tab="providers" aria-selected="true">providers</button>
    <button type="button" role="tab" data-tab="prompts" aria-selected="false">prompts</button>

    <strong>on plain wi-fi, not the tailnet</strong>

    <h1>this page has closed</h1>
    <p>its session ended, or the r1 left its page. on the r1, open settings, ask, on a phone, and scan the new code</p>
