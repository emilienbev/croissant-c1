org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# The app's application id. A fork sets its own here, and keeps it for good once installed:
# a new id is a new app and unbinds Device Owner. The installer reads it from here too.
croissant.applicationId=com.bleural.croissant

# The GitHub repository the app looks to for releases (BuildConfig.UPDATE_REPO). A fork sets its own.
croissant.updateRepo=emilienbev/croissant-c1
