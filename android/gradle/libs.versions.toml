zxingcpp = { group = "io.github.zxing-cpp", name = "android", version.ref = "zxingcpp" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxingcore" }
quickjs = { group = "io.github.dokar3", name = "quickjs-kt", version.ref = "quickjs" }
quickjs-jvm = { group = "io.github.dokar3", name = "quickjs-kt-jvm", version.ref = "quickjs" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
