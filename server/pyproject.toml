[project]
name = "croissant-server"
version = "0.1.0"
description = "Voice backend for the Rabbit R1: streaming speech to text, pictures and web search"
requires-python = ">=3.12"
dependencies = [
    "websockets>=17.1",
    "ollama>=0.6.2",
    "numpy>=2.0",
    # The local models: MLX on Apple Silicon only. Anywhere else the server runs with
    # providers for pictures and faster-whisper for a local STT.
    "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mflux>=0.19.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.1; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "pillow>=11",
    "ddgs>=9.16",
    "openai>=1.60",
    "google-genai>=1.65",
    "segno>=1.6.6",
]

[project.scripts]
croissant-server = "croissant_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["croissant_server"]

[tool.uv]
# google-genai caps websockets below 17 and the server needs 17's process_request
# (DELETE on /generated). google-genai uses websockets only for its Live
# API, which this server never calls.
override-dependencies = ["websockets>=17.1"]
