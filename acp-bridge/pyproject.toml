[project]
name = "acp-bridge"
version = "0.1.0"
description = "Runs ACP coding agents (Claude Code, Codex, Hermes, Pi) on this computer and serves them to the Rabbit R1"
requires-python = ">=3.12"
dependencies = [
    "segno>=1.6.6",
    "websockets>=15",
]

[project.scripts]
acp-bridge = "acp_bridge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["acp_bridge"]
